# What this repo reverses. Originals are never committed; they live in R2 under these keys
# and every tool verifies the sha256 before use.

project = "t5"
title = "Call of Duty: Black Ops (PC)"
graph = "re_t5"
r2_public = "https://r2.houseofkublai.com/"
ghidra = "12.1.4"
compiler = "MSVC 2008 (VC90), x86. Reference server builds: optimization effectively off, asserts on. Retail: optimized, whole-program (LTCG), no asserts"

# Reference builds have the original private PDB and MAP; retail builds are the target (docs/retail-builds.md).
# `analyze = true` puts a build in the next Ghidra pipeline run (.github/workflows/ghidra.yml); a manual run
# can name any builds instead.

# Primary reference build: full private PDB (24.6k functions with types, line tables, 1,939 compilands).
[[build]]
id = "CoDMPServer"
kind = "reference"
analyze = false
timestamp = "2010-11-05T18:39:30Z"
pdb_guid = "022BC206-AF53-479B-BB12-D9FEBB7545E4"
pdb_age = 65
exe = { key = "bo1/exes/Call of Duty - Black Ops PC Server/CoDMPServer.exe", sha256 = "4e325afa62cd2e1c2cea2af42cfe80282233f2e25706b865a51b3ded0842eff5" }
pdb = { key = "bo1/exes/Call of Duty - Black Ops PC Server/CoDMPServer.pdb", sha256 = "7f50be8f11a92de89d874402da0f9c09a0878bc6afa738e2d374a9be57cf3de9" }
